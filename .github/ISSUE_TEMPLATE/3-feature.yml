name: Feature request
description: Something limen or limenctl should do that it does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and why limen gets in the way or cannot do it today.
      placeholder: |
        Our CI runners pull the same images from a private registry on every job, and limen only
        serves public registries anonymously.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, from your side - flags, commands, behaviour.
    validations:
      required: true

  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - limen (the cache)
        - limenctl (configuring hosts)
        - Migration
        - Setup scripts
        - Metrics and operations
        - A new client or platform
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do today instead, or other ways you considered.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        limen depends on the Go standard library only. A proposal needing a third-party module
        needs a strong case; say why the standard library cannot do it.
